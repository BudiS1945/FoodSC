<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buat akun — FoodSC</title><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/auth.css"></head><body class="auth-page" data-page="register"><main class="auth-wrap"><a class="brand" href="index.html"><span class="brand-mark">F</span><span>FoodSC</span></a><section class="auth-card"><span class="eyebrow">CREATE YOUR ACCOUNT</span><h1>Selamat datang<br><em>di FoodSC.</em></h1><p class="muted">Buat akun lokal untuk menyimpan preferensi dan riwayat scan di browser ini.</p><form id="registerForm" class="form-stack"><label>Nama pengguna<input name="username" required minlength="3" maxlength="30" autocomplete="username"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><label>Konfirmasi password<input name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></label><button class="btn btn-dark full" type="submit">Buat akun <span>→</span></button></form><p class="form-note">Demo lokal: password di-hash menggunakan Web Crypto, tetapi autentikasi LocalStorage tidak aman untuk akun publik atau data sensitif.</p><p class="auth-switch">Sudah terdaftar? <a href="login.html">Login</a></p></section></main><div class="toast" id="toast"></div><script src="assets/js/app.js"></script><script src="assets/js/auth.js"></script></body></html>
